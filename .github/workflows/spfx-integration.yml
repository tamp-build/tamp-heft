name: SPFx integration

# HeftDevServer against a real SharePoint Framework `heft start` (tests/spfx-fixture). Too slow and heavy
# (~1 GB of node_modules) for every PR, so it runs nightly, on demand, and on PRs that touch the dev server
# or the fixture.
on:
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/Tamp.Heft.V1/HeftDevServer*.cs'
      - 'src/Tamp.Heft.V1/HeftServeConfig.cs'
      - 'src/Tamp.Heft.V1/HeftBinaryResolver.cs'
      - 'tests/Tamp.Heft.V1.Tests/RealSpfxDevServerTests.cs'
      - 'tests/spfx-fixture/**'
      - '.github/scripts/provision-spfx-dev-cert.cjs'
      - '.github/workflows/spfx-integration.yml'

permissions:
  contents: read

jobs:
  real-heft-start:
    name: real heft start (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # A dev-certificate prompt or a hung server must not hold a runner for hours.
    timeout-minutes: 25
    env:
      DOTNET_NOLOGO: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
      TampCoreMode: package

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/spfx-fixture/package-lock.json

      - name: Install the fixture (npm ci, from the committed lockfile)
        working-directory: tests/spfx-fixture
        run: npm ci --no-audit --no-fund

      # On Windows, heft start finds no trusted dev certificate and runs `certutil -user -addstore root`,
      # which waits for a confirmation dialog nobody can click on a hosted runner (the first run hung until
      # the readiness timeout). Heft only accepts a CA in the *user* root store (it checks with
      # `certutil -user -verifystore root`), and adding one there through CryptoAPI is what raises the
      # dialog. So: create the certificate without trusting it, add the CA to the machine store (admin, no
      # dialog), and copy that registry entry into the user store, which raises nothing.
      - name: Provision a trusted dev certificate (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ca = node .github/scripts/provision-spfx-dev-cert.cjs tests/spfx-fixture | Select-Object -Last 1
          if ($LASTEXITCODE -ne 0) { throw "certificate provisioning failed" }
          $thumb = (New-Object System.Security.Cryptography.X509Certificates.X509Certificate2($ca)).Thumbprint
          Write-Host "CA certificate: $ca ($thumb)"
          certutil -f -addstore Root "$ca"
          if ($LASTEXITCODE -ne 0) { throw "certutil -addstore Root failed" }

          $machine = "HKLM:\SOFTWARE\Microsoft\SystemCertificates\ROOT\Certificates\$thumb"
          $user = "HKCU:\Software\Microsoft\SystemCertificates\Root\Certificates\$thumb"
          $blob = (Get-ItemProperty -Path $machine -Name Blob).Blob
          New-Item -Path $user -Force | Out-Null
          New-ItemProperty -Path $user -Name Blob -PropertyType Binary -Value $blob -Force | Out-Null

          # The same check debug-certificate-manager makes; fail here, not minutes into a hung server.
          certutil -user -verifystore root 731c321744e34650a202e3ef91c3c1b0 | Out-Null
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Registry copy not visible to certutil -user; trying Import-Certificate with a 30s limit."
            $job = Start-Job { Import-Certificate -FilePath $using:ca -CertStoreLocation Cert:\CurrentUser\Root }
            if (-not (Wait-Job $job -Timeout 30)) { Stop-Job $job; Write-Host "Import-Certificate timed out (dialog)." }
            certutil -user -verifystore root 731c321744e34650a202e3ef91c3c1b0 | Out-Null
          }
          if ($LASTEXITCODE -ne 0) { throw "the dev CA is not visible to 'certutil -user -verifystore root'; heft start would prompt" }
          Write-Host "Dev CA is trusted for the current user."

      - name: Run HeftDevServer against heft start
        shell: bash
        run: |
          export TAMP_HEFT_SPFX_FIXTURE="$GITHUB_WORKSPACE/tests/spfx-fixture"
          dotnet test tests/Tamp.Heft.V1.Tests -f net10.0 --configuration Release \
            --filter "FullyQualifiedName~RealSpfx" \
            --logger "console;verbosity=detailed" \
            --logger "trx;LogFileName=spfx-integration.trx" --results-directory ./TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: spfx-integration-${{ matrix.os }}
          path: ./TestResults/**/*.trx
          if-no-files-found: warn
